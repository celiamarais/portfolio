<style>
:root{--ink:#231d1a;--soft:rgba(35,29,26,.6);--line:rgba(35,29,26,.14);--paper:#fffdfb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 Karla,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:380px}
h1{font:400 clamp(20px,4vw,27px)/1.25 Karla,system-ui,sans-serif;letter-spacing:-.01em;margin:0 0 8px}
p{margin:0 0 28px;color:var(--soft)}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--ink);outline-offset:1px}
button{font:500 15px/1 Karla,system-ui,sans-serif;padding:0 18px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);cursor:pointer}
.err{min-height:22px;margin:10px 0 0;font-size:14px;color:#a3352b}
.links{display:flex;justify-content:space-between;margin-top:32px;font-size:14px}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)}
#cm-toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;border-radius:2px;padding:12px 18px;opacity:0;transition:opacity .3s;pointer-events:none}
</style>

  <div class="links"><a href="#" id="em">Email for password</a><a href="../index.html">Back to home</a></div>
</main>

function u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function open(pw,quiet){
  try{
    var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.i,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.v)},key,u(D.c));
    try{sessionStorage.setItem('cm-pw',pw);}catch(_){}
    var html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
  }catch(e){ if(!quiet){document.getElementById('err').textContent='That password didn\u2019t work. Try again.';} }
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();open(document.getElementById('pw').value,false);});
document.getElementById('em').addEventListener('click',function(e){e.preventDefault();var EM='celia.m.marais@gmail.com';
  var t=document.getElementById('cm-toast');var ok=function(){t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';},1800);};
  if(navigator.clipboard){navigator.clipboard.writeText(EM).then(ok,ok);}else{ok();}});
try{var s=sessionStorage.getItem('cm-pw');if(s)open(s,true);}catch(_){}
})();
